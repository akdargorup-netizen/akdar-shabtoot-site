<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1c14" />
  <title>أخضر شبتوت بحري — غير متصل</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg:       #0f1712;
      --color-surface:  #1a2b1f;
      --color-border:   #2a4030;
      --color-text:     #d4e8d8;
      --color-muted:    #7a9e82;
      --color-accent:   #4caf77;
      --font-ui: 'Tajawal', 'Segoe UI', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.5rem;
      text-align: center;
      gap: 1.5rem;
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrap svg {
      width: 32px;
      height: 32px;
      stroke: var(--color-muted);
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-text);
      line-height: 1.4;
    }

    p {
      font-size: 0.95rem;
      color: var(--color-muted);
      line-height: 1.7;
      max-width: 280px;
    }

    button {
      margin-top: 0.5rem;
      padding: 0.75rem 2rem;
      border-radius: 999px;
      border: 1.5px solid var(--color-accent);
      background: transparent;
      color: var(--color-accent);
      font-family: var(--font-ui);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    button:hover, button:focus-visible {
      background: var(--color-accent);
      color: #0f1712;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="icon-wrap">
    <!-- wifi-off icon -->
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <circle cx="12" cy="20" r="1" fill="currentColor"/>
    </svg>
  </div>

  <h1>ما في اتصال بالنت</h1>

  <p>
    تحقق من الاتصال،<br />
    وحاول تاني.
  </p>

  <button onclick="location.reload()">حاول تاني</button>

</body>
</html>
