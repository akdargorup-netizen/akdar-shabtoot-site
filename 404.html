<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>الصفحة غير موجودة — شبتوت بحري</title>
  <!-- صفحة 404 مستقلة تمامًا (بلا سكربتات ولا ملفات خارجية). هدف قواعد الحجب
       في firebase.json: صفحة الخطأ الافتراضية للمسارات غير الموجودة. -->
  <style>
    :root { color-scheme: dark light; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: #0f1a14; color: #f1f4ee;
    }
    main { max-width: 360px; }
    h1 { margin: 0 0 8px; font-size: 3rem; line-height: 1; color: #8fc9a2; }
    p  { margin: 0 0 24px; font-size: 1.0625rem; line-height: 1.8; opacity: .9; }
    a  {
      display: inline-block; min-height: 44px; line-height: 44px; padding: 0 28px;
      border-radius: 999px; background: #8fc9a2; color: #0f1a14;
      font-weight: 700; text-decoration: none;
    }
    @media (prefers-color-scheme: light) {
      body { background: #f4f7f2; color: #17261d; }
      h1 { color: #2f6b48; }
      a  { background: #2f6b48; color: #fff; }
    }
  </style>
</head>
<body>
  <main>
    <h1>٤٠٤</h1>
    <p>هذه الصفحة غير موجودة.</p>
    <a href="/akdar-shabtoot-site/">العودة للرئيسية</a>
  </main>
</body>
</html>
